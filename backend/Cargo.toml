[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/models",
    "crates/ai",
    "crates/media",
    "crates/api",
    "crates/server",
]
default-members = ["crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[workspace.dependencies]
common = { path = "crates/common" }
models = { path = "crates/models" }
ai = { path = "crates/ai" }
media = { path = "crates/media" }
api = { path = "crates/api" }

argon2 = "0.6.0"
arc-swap = "1.9.3"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
bytes = "1.12.1"
chrono = "0.4.45"
cookie = "0.18.2"
dashmap = "7.0.0-rc2"
deadpool-postgres = "0.14.2"
dotenvy = "0.15"
futures-util = "0.3.34"
headers = "0.4.2"
http = "1"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
libc = "0.2"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
opentelemetry = "0.26"
opentelemetry-otlp = { version = "0.26", features = ["tonic", "tokio"] }
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["download-binaries", "tls-rustls"] }
oxideav-bitstream = "0.0.3"
opus = "0.4.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rtc = "0.21.1"
rtp = "0.17.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sdp-types = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.5.10"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.27"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v7", "serde"] }
validator = { version = "0.20", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
incremental = true
debug = "line-tables-only"
